name: Build Windows EXE
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build EXE
        run: python -m PyInstaller --noconfirm --onefile --windowed --name SwitchCustomizer switch_customizer.py
      - uses: actions/upload-artifact@v4
        with:
          name: SwitchCustomizer-Windows
          path: dist/SwitchCustomizer.exe
